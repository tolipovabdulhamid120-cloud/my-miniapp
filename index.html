<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yotoqxona Davomati</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- SheetJS for Excel Import -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-indigo-600 text-white shadow-md p-4 sticky top-0 z-50">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <div>
        <h1 class="text-lg font-bold">🏫 Yotoqxona Davomati</h1>
        <p id="userInfo" class="text-xs text-indigo-200">Foydalanuvchi aniqlanmoqda...</p>
      </div>
      <div id="adminBadge" class="hidden bg-emerald-500 text-white text-xs font-semibold px-2.5 py-1 rounded-full shadow">
        Admin 🛡️
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-md mx-auto p-4 w-full flex-grow space-y-4 pb-32">
    
    <!-- Controls Card -->
    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 space-y-3">
      <div>
        <label class="block text-xs font-medium text-slate-500 mb-1">Sana:</label>
        <input type="date" id="dateInput" class="w-full border border-slate-200 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-500 mb-1">Navbatchi o'qituvchi:</label>
        <input type="text" id="dutyTeacher" placeholder="Ism familiyangizni kiriting" class="w-full border border-slate-200 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
      </div>

      <div class="grid grid-cols-2 gap-2 pt-1">
        <button onclick="markAll('present')" class="bg-emerald-50 text-emerald-700 hover:bg-emerald-100 font-medium py-2 px-3 rounded-lg text-xs transition">Hamma kelgan</button>
        <button onclick="markAll('absent')" class="bg-rose-50 text-rose-700 hover:bg-rose-100 font-medium py-2 px-3 rounded-lg text-xs transition">Hamma kelmagan</button>
      </div>
    </div>

    <!-- Admin Panel (Only for Admins) -->
    <div id="adminPanel" class="hidden bg-amber-50 border border-amber-200 p-4 rounded-xl space-y-3 shadow-sm">
      <h2 class="text-xs font-bold uppercase tracking-wider text-amber-800">🛡️ Admin Boshqaruvi (O'quvchi qo'shish)</h2>
      
      <!-- Bittalab qo'shish -->
      <div class="flex gap-2">
        <input type="text" id="newStudentName" placeholder="Yangi o'quvchi F.I.Sh." class="flex-grow border border-amber-300 bg-white rounded-lg p-2 text-sm focus:outline-none">
        <button onclick="addStudent()" class="bg-amber-600 hover:bg-amber-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition shadow-sm">Qo'shish</button>
      </div>

      <!-- Excel'dan o'quvchilarni import qilish -->
      <div class="pt-2 border-t border-amber-200/60">
        <label class="block text-xs font-medium text-amber-900 mb-1">Excel fayldan o'quvchilar ro'yxatini yuklash:</label>
        <div class="flex gap-2 items-center">
          <input type="file" id="excelFile" accept=".xlsx, .xls, .csv" class="w-full text-xs text-slate-500 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-amber-600 file:text-white hover:file:bg-amber-700 cursor-pointer">
          <button onclick="importFromExcel()" class="bg-amber-700 hover:bg-amber-800 text-white px-3 py-1.5 rounded-lg text-xs font-medium transition whitespace-nowrap">Import</button>
        </div>
        <p class="text-[10px] text-amber-700 mt-1">Excel fayldan o'quvchilar ismini avtomattik o'qiydi.</p>
      </div>
    </div>

    <!-- Students List -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-100 overflow-hidden">
      <div class="p-3 bg-slate-50 border-b border-slate-100 flex justify-between items-center">
        <span class="text-xs font-bold text-slate-600 uppercase tracking-wider">O'quvchilar ro'yxati</span>
        <span id="studentCount" class="text-xs text-slate-400 font-medium">0 ta</span>
      </div>
      <div id="studentsContainer" class="divide-y divide-slate-100 max-h-[40vh] overflow-y-auto">
        <!-- JS orqali to'ldiriladi -->
      </div>
    </div>

    <!-- Actions / Copy for Google Sheets -->
    <div class="space-y-2 pt-2">
      <button onclick="saveData()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 px-4 rounded-xl shadow-sm transition flex items-center justify-center gap-2">
        <span>💾 Saqlash va Sinxronizatsiya</span>
      </button>

      <!-- Google Sheets uchun nusxalash tugmasi -->
      <button onclick="copyForGoogleSheets()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-3 px-4 rounded-xl shadow-sm transition flex items-center justify-center gap-2">
        <span>📋 Google Sheets uchun nusxalash (Copy)</span>
      </button>
    </div>

    <!-- Archived Students Section (Admin) -->
    <div id="archivedSection" class="hidden pt-4">
      <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">📦 Arxivlangan o'quvchilar</h3>
      <div id="archivedContainer" class="bg-white rounded-xl border border-slate-100 p-3 space-y-2"></div>
    </div>

  </main>

  <!-- Script Logic -->
  <script>
    // --- FIREBASE CONFIGURATION ---
    const firebaseConfig = {
      databaseURL: "https://yotoqxona-18a80-default-rtdb.firebaseio.com"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // --- ADMIN TELEGRAM IDs ---
    const ADMIN_IDS = [8081723573];

    // --- TELEGRAM WEB APP INIT ---
    let tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) tg.expand();

    let currentUser = { id: 8081723573, firstName: "Admin" };
    if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id) {
      currentUser.id = tg.initDataUnsafe.user.id;
      currentUser.firstName = tg.initDataUnsafe.user.first_name || "Mehmon";
    }

    const isAdmin = ADMIN_IDS.includes(Number(currentUser.id));
    document.getElementById("userInfo").innerText = `👤 ID: ${currentUser.id} | ${currentUser.firstName}`;
    
    if (isAdmin) {
      document.getElementById("adminBadge").classList.remove("hidden");
      document.getElementById("adminPanel").classList.remove("hidden");
      document.getElementById("archivedSection").classList.remove("hidden");
    }

    // Date & UI elements
    const dateInput = document.getElementById("dateInput");
    const dutyTeacherInput = document.getElementById("dutyTeacher");
    const studentsContainer = document.getElementById("studentsContainer");
    const archivedContainer = document.getElementById("archivedContainer");
    const studentCountEl = document.getElementById("studentCount");

    const today = new Date().toISOString().split('T')[0];
    dateInput.value = today;

    let studentsData = {};
    let attendanceData = {};
    let dutyTeachersData = {};

    // --- FIREBASE LISTENERS ---
    db.ref("students").on("value", (snapshot) => {
      studentsData = snapshot.val() || {};
      renderStudents();
    });

    db.ref("dutyTeachers").on("value", (snapshot) => {
      dutyTeachersData = snapshot.val() || {};
      updateDutyTeacherInput();
    });

    db.ref("attendance").on("value", (snapshot) => {
      attendanceData = snapshot.val() || {};
      renderStudents();
    });

    dateInput.addEventListener("change", () => {
      updateDutyTeacherInput();
      renderStudents();
    });

    dutyTeacherInput.addEventListener("input", (e) => {
      const curDate = dateInput.value;
      dutyTeachersData[curDate] = e.target.value;
      db.ref("dutyTeachers/" + curDate).set(e.target.value);
    });

    function updateDutyTeacherInput() {
      const curDate = dateInput.value;
      dutyTeacherInput.value = dutyTeachersData[curDate] || "";
    }

    // --- RENDER STUDENTS ---
    function renderStudents() {
      studentsContainer.innerHTML = "";
      archivedContainer.innerHTML = "";
      
      const curDate = dateInput.value;
      const dailyAttendance = (attendanceData && attendanceData[curDate]) || {};
      
      const studentIds = Object.keys(studentsData);
      const activeStudentsCount = studentIds.filter(id => !studentsData[id].archived).length;
      studentCountEl.innerText = `${activeStudentsCount} ta`;

      if (studentIds.length === 0) {
        studentsContainer.innerHTML = `<div class="p-4 text-center text-xs text-slate-400">Hozircha o'quvchilar yo'q.</div>`;
        if (archivedContainer) archivedContainer.innerHTML = `<span class="text-xs text-slate-400">Arxiv bo'sh.</span>`;
        return;
      }

      let activeCount = 0;
      let archivedCount = 0;

      studentIds.forEach(id => {
        const student = studentsData[id];
        const status = dailyAttendance[id] || 'present';

        if (student.archived) {
          archivedCount++;
          if (isAdmin) {
            archivedContainer.innerHTML += `
              <div class="flex justify-between items-center text-xs bg-slate-50 p-2 rounded-lg border border-slate-100">
                <span class="text-slate-500 line-through font-medium">${student.name}</span>
                <div class="flex gap-2">
                  <button onclick="restoreStudent('${id}')" class="text-emerald-600 font-semibold hover:underline">Tiklash</button>
                  <button onclick="deleteStudent('${id}')" class="text-rose-600 font-semibold hover:underline">O'chirish</button>
                </div>
              </div>`;
          }
          return;
        }

        activeCount++;
        studentsContainer.innerHTML += `
          <div class="p-3 flex items-center justify-between hover:bg-slate-50/50 transition">
            <div class="flex items-center gap-3">
              <span class="text-xs font-bold text-slate-400 w-5">${activeCount}.</span>
              <span class="text-sm font-medium text-slate-700">${student.name}</span>
            </div>
            <div class="flex items-center gap-2">
              <button onclick="toggleStatus('${id}')" class="px-3 py-1.5 rounded-lg text-xs font-semibold transition ${status === 'present' ? 'bg-emerald-500 text-white shadow-sm' : 'bg-rose-500 text-white shadow-sm'}">
                ${status === 'present' ? 'Bor' : "Yo'q"}
              </button>
              ${isAdmin ? `
                <button onclick="archiveStudent('${id}')" class="text-slate-400 hover:text-amber-600 p-1 text-sm font-bold" title="Arxivlash">📦</button>
              ` : ''}
            </div>
          </div>`;
      });

      if (archivedCount === 0 && isAdmin) {
        archivedContainer.innerHTML = `<span class="text-xs text-slate-400">Arxiv bo'sh.</span>`;
      }
    }

    // --- ATTENDANCE ACTIONS ---
    function toggleStatus(id) {
      const curDate = dateInput.value;
      const currentStatus = (attendanceData[curDate] && attendanceData[curDate][id]) || 'present';
      const newStatus = currentStatus === 'present' ? 'absent' : 'present';
      
      db.ref(`attendance/${curDate}/${id}`).set(newStatus);
    }

    function markAll(status) {
      const curDate = dateInput.value;
      const updates = {};
      
      Object.keys(studentsData).forEach(id => {
        if (!studentsData[id].archived) {
          updates[`attendance/${curDate}/${id}`] = status;
        }
      });
      
      db.ref().update(updates);
    }

    // --- ADMIN ACTIONS ---
    function addStudent() {
      if (!isAdmin) return alert("Ruxsat etilmagan!");
      const nameInput = document.getElementById("newStudentName");
      const name = nameInput.value.trim();
      if (!name) return alert("O'quvchi ismini kiriting!");

      const newRef = db.ref("students").push();
      newRef.set({ name: name, archived: false })
        .then(() => {
          nameInput.value = "";
        })
        .catch(err => alert("Xatolik: " + err.message));
    }

    // --- IMPORT FROM EXCEL ---
    function importFromExcel() {
      if (!isAdmin) return alert("Ruxsat etilmagan!");
      const fileInput = document.getElementById("excelFile");
      const file = fileInput.files[0];
      if (!file) return alert("Iltimos, Excel faylni tanlang!");

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const firstSheetName = workbook.SheetNames[0];
          const worksheet = workbook.Sheets[firstSheetName];
          const jsonRows = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

          let addedCount = 0;
          jsonRows.forEach(row => {
            const studentNameCell = row.find(cell => 
              cell && typeof cell === 'string' && 
              cell.trim().length > 3 && 
              !cell.toLowerCase().includes('f.i.sh') && 
              !cell.toLowerCase().includes('ism') && 
              !cell.toLowerCase().includes('sana')
            );

            if (studentNameCell) {
              const trimmed = studentNameCell.trim();
              const newRef = db.ref("students").push();
              newRef.set({ name: trimmed, archived: false });
              addedCount++;
            }
          });

          alert(`${addedCount} ta o'quvchi muvaffaqiyatli import qilindi!`);
          fileInput.value = "";
        } catch (err) {
          alert("Excel faylni o'qishda xatolik yuz berdi: " + err.message);
        }
      };
      reader.readAsArrayBuffer(file);
    }

    function archiveStudent(id) {
      if (!isAdmin) return;
      if (confirm("Haqiqatan ham bu o'quvchini arxivlamoqchimisiz?")) {
        db.ref("students/" + id + "/archived").set(true);
      }
    }

    function restoreStudent(id) {
      if (!isAdmin) return;
      db.ref("students/" + id + "/archived").set(false);
    }

    function deleteStudent(id) {
      if (!isAdmin) return;
      if (confirm("O'quvchini bazadan butunlay o'chirib yuborishni tasdiqlaysizmi?")) {
        db.ref("students/" + id).remove();
      }
    }

    // --- SAVE TO FIREBASE ---
    function saveData() {
      const curDate = dateInput.value;
      const currentDutyTeacher = dutyTeacherInput.value.trim();
      
      const promises = [
        db.ref("attendance/" + curDate).set(attendanceData[curDate] || {}),
        db.ref("dutyTeachers/" + curDate).set(currentDutyTeacher)
      ];

      Promise.all(promises)
        .then(() => alert("Ma'lumotlar muvaffaqiyatli saqlandi va sinxronizatsiya qilindi!"))
        .catch(err => alert("Xatolik: " + err.message));
    }

    // --- COPY FOR GOOGLE SHEETS (Yangi va 100% ishlaydigan usul) ---
    function copyForGoogleSheets() {
      const activeStudentIds = Object.keys(studentsData).filter(id => !studentsData[id].archived);

      if (activeStudentIds.length === 0) {
        return alert("Nusxalash uchun o'quvchilar yo'q!");
      }

      const dates = Object.keys(attendanceData).sort();
      let tsvText = "";

      // 1-qatorda sarlavhalar (Tab belgilari bilan ajratiladi)
      tsvText += "Sana\tNavbatchi O'qituvchi\tO'quvchi F.I.Sh.\tHolati\n";

      if (dates.length === 0) {
        const curDate = dateInput.value;
        const dutyTeacherName = dutyTeachersData[curDate] || "Kiritilmagan";
        activeStudentIds.forEach(id => {
          tsvText += `${curDate}\t${dutyTeacherName}\t${studentsData[id].name}\tBor\n`;
        });
      } else {
        dates.forEach(d => {
          const dutyTeacherName = dutyTeachersData[d] || "Kiritilmagan";
          activeStudentIds.forEach(id => {
            const status = attendanceData[d] && attendanceData[d][id] ? attendanceData[d][id] : 'present';
            const statusText = status === 'present' ? 'Bor' : "Yo'q";
            tsvText += `${d}\t${dutyTeacherName}\t${studentsData[id].name}\t${statusText}\n`;
          });
        });
      }

      // Clipboard-ga nusxalash
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(tsvText)
          .then(() => {
            alert("✅ Davomat jadvali nusxalandi!\n\nEndi Google Sheets yoki Excel'ga o'tib 'Joylashtirish' (Paste) tugmasini bosing.");
          })
          .catch(err => {
            fallbackCopyTextToClipboard(tsvText);
          });
      } else {
        fallbackCopyTextToClipboard(tsvText);
      }
    }

    // Eski qurilmalar uchun zaxira nusxalash mexanizmi
    function fallbackCopyTextToClipboard(text) {
      const textArea = document.createElement("textarea");
      textArea.value = text;
      textArea.style.position = "fixed";
      document.body.appendChild(textArea);
      textArea.focus();
      textArea.select();
      try {
        document.execCommand('copy');
        alert("✅ Davomat jadvali nusxalandi!\n\nEndi Google Sheets yoki Excel'ga o'tib 'Joylashtirish' (Paste) tugmasini bosing.");
      } catch (err) {
        alert("Nusxalashda xatolik yuz berdi: " + err);
      }
      document.body.removeChild(textArea);
    }
  </script>
</body>
</html>
