
<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yotoqxona Davomati</title>
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- SheetJS (Excel yuklash kutubxonasi) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    :root {
      --bg-color: var(--tg-theme-bg-color, #f0f2f5);
      --text-color: var(--tg-theme-text-color, #1a1a1a);
      --card-bg: var(--tg-theme-secondary-bg-color, #ffffff);
      --primary-color: var(--tg-theme-button-color, #2481cc);
      --primary-text: var(--tg-theme-button-text-color, #ffffff);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 12px;
      box-sizing: border-box;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    h2 { margin: 0 0 10px 0; font-size: 18px; text-align: center; }

    .date-picker-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .date-picker-box label { font-weight: bold; font-size: 14px; }
    .date-picker-box input {
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 14px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      text-align: center;
    }

    .stat-item {
      background: rgba(0,0,0,0.03);
      padding: 8px;
      border-radius: 8px;
    }
    .stat-item .val { font-size: 18px; font-weight: bold; }
    .stat-item .lbl { font-size: 11px; opacity: 0.7; }

    .form-row {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }

    input[type="text"] {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }

    .room-input { width: 80px !important; flex: none !important; }

    button {
      border: none;
      border-radius: 8px;
      padding: 10px 14px;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
    }

    .btn-primary { background: var(--primary-color); color: var(--primary-text); }
    .btn-excel { background: #107c41; color: #fff; width: 100%; margin-top: 10px; }

    .student-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }
    .student-item:last-child { border-bottom: none; }

    .student-info { flex: 1; }
    .student-name { font-weight: 600; font-size: 14px; }
    .student-room { font-size: 12px; color: #666; }

    .toggle-btns { display: flex; gap: 6px; align-items: center; }

    .btn-status {
      padding: 6px 12px;
      font-size: 12px;
      border-radius: 6px;
      opacity: 0.4;
    }
    .btn-status.active { opacity: 1; transform: scale(1.03); }
    .btn-present { background: #28a745; color: white; }
    .btn-absent { background: #dc3545; color: white; }

    .btn-del {
      background: transparent;
      color: #999;
      font-size: 14px;
      padding: 4px 6px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>🏢 Yotoqxona Davomati</h2>
    
    <div class="date-picker-box">
      <label for="attDate">Sana:</label>
      <input type="date" id="attDate" onchange="loadAttendance()">
    </div>

    <div class="stats-grid">
      <div class="stat-item">
        <div class="val" id="totalCnt">0</div>
        <div class="lbl">Jami</div>
      </div>
      <div class="stat-item" style="color: #28a745;">
        <div class="val" id="presentCnt">0</div>
        <div class="lbl">Bor</div>
      </div>
      <div class="stat-item" style="color: #dc3545;">
        <div class="val" id="absentCnt">0</div>
        <div class="lbl">Yo'q</div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="form-row">
      <input type="text" id="stuName" placeholder="O'quvchi F.I.Sh.">
      <input type="text" id="stuRoom" class="room-input" placeholder="Xona">
      <button class="btn-primary" onclick="addStudent()">+</button>
    </div>
  </div>

  <div class="card">
    <div id="studentList"></div>
    <button class="btn-excel" onclick="exportToExcel()">📊 Excel ga yuklab olish (.xlsx)</button>
  </div>

  <script>
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) tg.expand();

    const dateInput = document.getElementById('attDate');
    dateInput.value = new Date().toISOString().split('T')[0];

    let students = JSON.parse(localStorage.getItem('yt_students')) || [
      { id: 1, name: "Sardor Salimov", room: "101" },
      { id: 2, name: "Bekzod Rustamov", room: "102" }
    ];

    let attendance = JSON.parse(localStorage.getItem('yt_attendance')) || {};

    function saveStudents() {
      localStorage.setItem('yt_students', JSON.stringify(students));
    }

    function saveAttendance() {
      localStorage.setItem('yt_attendance', JSON.stringify(attendance));
    }

    function addStudent() {
      const nameInput = document.getElementById('stuName');
      const roomInput = document.getElementById('stuRoom');
      const name = nameInput.value.trim();
      const room = roomInput.value.trim() || '---';

      if (!name) return alert("O'quvchi ismini kiriting!");

      students.push({ id: Date.now(), name, room });
      nameInput.value = '';
      roomInput.value = '';
      saveStudents();
      loadAttendance();
    }

    function deleteStudent(id) {
      if (confirm("Ushbu o'quvchini o'chirmoqchimisiz?")) {
        students = students.filter(s => s.id !== id);
        saveStudents();
        loadAttendance();
      }
    }

    function setStatus(stuId, status) {
      const curDate = dateInput.value;
      if (!attendance[curDate]) attendance[curDate] = {};
      attendance[curDate][stuId] = status;
      saveAttendance();
      loadAttendance();
    }

    function loadAttendance() {
      const curDate = dateInput.value;
      const curAtt = attendance[curDate] || {};
      const listDiv = document.getElementById('studentList');
      listDiv.innerHTML = '';

      let presentCnt = 0;
      let absentCnt = 0;

      if (students.length === 0) {
        listDiv.innerHTML = '<p style="text-align:center; color:#888;">O\'quvchilar yo\'q. Yuqorida yangi o\'quvchi qo\'shing.</p>';
      }

      students.forEach(stu => {
        const status = curAtt[stu.id] || 'present';
        if (status === 'present') presentCnt++;
        if (status === 'absent') absentCnt++;

        const item = document.createElement('div');
        item.className = 'student-item';
        item.innerHTML = `
          <div class="student-info">
            <div class="student-name">${stu.name}</div>
            <div class="student-room">🏢 Xona: ${stu.room}</div>
          </div>
          <div class="toggle-btns">
            <button class="btn-status btn-present ${status === 'present' ? 'active' : ''}" onclick="setStatus(${stu.id}, 'present')">Bor</button>
            <button class="btn-status btn-absent ${status === 'absent' ? 'active' : ''}" onclick="setStatus(${stu.id}, 'absent')">Yo'q</button>
            <button class="btn-del" onclick="deleteStudent(${stu.id})">✕</button>
          </div>
        `;
        listDiv.appendChild(item);
      });

      document.getElementById('totalCnt').innerText = students.length;
      document.getElementById('presentCnt').innerText = presentCnt;
      document.getElementById('absentCnt').innerText = absentCnt;
    }

    function exportToExcel() {
      let excelData = [];
      const dates = Object.keys(attendance).sort();

      if (dates.length === 0) {
        const curDate = dateInput.value;
        students.forEach(s => {
          excelData.push({
            "Sana": curDate,
            "Xona №": s.room,
            "F.I.Sh.": s.name,
            "Holati": "Bor"
          });
        });
      } else {
        dates.forEach(d => {
          students.forEach(s => {
            const status = attendance[d] && attendance[d][s.id] ? attendance[d][s.id] : 'present';
            excelData.push({
              "Sana": d,
              "Xona №": s.room,
              "F.I.Sh.": s.name,
              "Holati": status === 'present' ? 'Bor' : "Yo'q"
            });
          });
        });
      }

      const worksheet = XLSX.utils.json_to_sheet(excelData);
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, "Yotoqxona Davomati");
      XLSX.writeFile(workbook, `Yotoqxona_Davomati_${dateInput.value}.xlsx`);
    }

    loadAttendance();
  </script>
</body>
</html>
