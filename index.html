<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yotoqxona Online Davomati</title>
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- SheetJS (Excel bilan ishlash) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  
  <style>
    :root {
      --bg-color: var(--tg-theme-bg-color, #f0f2f5);
      --text-color: var(--tg-theme-text-color, #1a1a1a);
      --card-bg: var(--tg-theme-secondary-bg-color, #ffffff);
      --primary-color: var(--tg-theme-button-color, #2481cc);
      --primary-text: var(--tg-theme-button-text-color, #ffffff);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 12px;
      box-sizing: border-box;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    h2 { margin: 0 0 10px 0; font-size: 18px; text-align: center; }
    h3 { margin: 0 0 10px 0; font-size: 15px; color: #555; }

    .date-picker-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }

    .date-picker-box label { font-weight: bold; font-size: 14px; }
    .date-picker-box input {
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 14px;
    }

    .duty-box {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      background: rgba(36, 129, 204, 0.08);
      padding: 8px 10px;
      border-radius: 8px;
    }

    .duty-box label { font-size: 13px; font-weight: bold; color: var(--primary-color); white-space: nowrap; }
    .duty-box input {
      flex: 1;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 13px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      text-align: center;
    }

    .stat-item {
      background: rgba(0,0,0,0.03);
      padding: 8px;
      border-radius: 8px;
    }
    .stat-item .val { font-size: 18px; font-weight: bold; }
    .stat-item .lbl { font-size: 11px; opacity: 0.7; }

    .form-row {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
    }

    input[type="text"] {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 10px 14px;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
    }

    .btn-primary { background: var(--primary-color); color: var(--primary-text); }
    .btn-excel-import { background: #0078d4; color: #fff; width: 100%; margin-bottom: 6px; display: block; text-align: center; box-sizing: border-box; }
    .btn-excel-export { background: #107c41; color: #fff; width: 100%; margin-top: 10px; }

    .student-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }
    .student-item:last-child { border-bottom: none; }

    .student-info { flex: 1; }
    .student-name { font-weight: 600; font-size: 14px; }

    .toggle-btns { display: flex; gap: 4px; align-items: center; }

    .btn-status {
      padding: 6px 10px;
      font-size: 12px;
      border-radius: 6px;
      opacity: 0.4;
    }
    .btn-status.active { opacity: 1; transform: scale(1.03); }
    .btn-present { background: #28a745; color: white; }
    .btn-absent { background: #dc3545; color: white; }

    .btn-archive {
      background: #ff9800;
      color: white;
      font-size: 11px;
      padding: 6px 8px;
      border-radius: 6px;
    }

    .btn-restore {
      background: #0078d4;
      color: white;
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 6px;
    }

    .btn-del {
      background: #dc3545;
      color: white;
      font-size: 12px;
      padding: 6px 8px;
      border-radius: 6px;
    }

    #excelFileInput { display: none; }
  </style>
</head>
<body>

  <div class="card">
    <h2>🏢 Yotoqxona Davomati (Onlayn)</h2>
    
    <div class="date-picker-box">
      <label for="attDate">Sana:</label>
      <input type="date" id="attDate" onchange="renderList()">
    </div>

    <!-- Navbatchi O'qituvchi Qismi -->
    <div class="duty-box">
      <label for="dutyTeacher">👨‍🏫 Navbatchi:</label>
      <input type="text" id="dutyTeacher" placeholder="O'qituvchi F.I.Sh." onchange="saveDutyTeacher()">
    </div>

    <div class="stats-grid">
      <div class="stat-item">
        <div class="val" id="totalCnt">0</div>
        <div class="lbl">Aktiv o'quvchilar</div>
      </div>
      <div class="stat-item" style="color: #28a745;">
        <div class="val" id="presentCnt">0</div>
        <div class="lbl">Bor</div>
      </div>
      <div class="stat-item" style="color: #dc3545;">
        <div class="val" id="absentCnt">0</div>
        <div class="lbl">Yo'q</div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="form-row">
      <input type="text" id="stuName" style="flex:1;" placeholder="O'quvchi F.I.Sh.">
      <button class="btn-primary" onclick="addStudent()">+</button>
    </div>

    <label for="excelFileInput" class="button btn-excel-import">📥 Excel'dan ro'yxat yuklash</label>
    <input type="file" id="excelFileInput" accept=".xlsx, .xls, .csv" onchange="importFromExcel(event)">
  </div>

  <!-- Aktiv Davomat Ro'yxati -->
  <div class="card">
    <h3>📋 Kunlik Davomat Ro'yxati</h3>
    <div id="studentList">
      <p style="text-align:center; color:#888;">Yuklanmoqda...</p>
    </div>
    <button class="btn-excel-export" onclick="exportToExcel()">📊 Davomatni Excel'ga yuklab olish (.xlsx)</button>
  </div>

  <!-- Yotoqxonadan Chiqib Ketganlar (Arxiv) -->
  <div class="card" style="background: #fafafa; border: 1px dashed #ccc;">
    <h3>🚪 Yotoqxonadan chiqib ketganlar (<span id="archivedCnt">0</span>)</h3>
    <div id="archivedList"></div>
  </div>

  <script>
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) tg.expand();

    // Firebase Bazangiz Sozlamasi
    const firebaseConfig = {
      databaseURL: "https://yotoqxona-18a80-default-rtdb.firebaseio.com"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const dateInput = document.getElementById('attDate');
    const dutyInput = document.getElementById('dutyTeacher');
    dateInput.value = new Date().toISOString().split('T')[0];

    let studentsData = {};
    let attendanceData = {};
    let dutyTeachersData = {};

    // Bazani real vaqtda tinglash
    db.ref().on('value', (snapshot) => {
      const data = snapshot.val() || {};
      studentsData = data.students || {};
      attendanceData = data.attendance || {};
      dutyTeachersData = data.dutyTeachers || {};
      renderList();
    });

    // Navbatchi o'qituvchini saqlash
    function saveDutyTeacher() {
      const curDate = dateInput.value;
      const name = dutyInput.value.trim();
      db.ref(`dutyTeachers/${curDate}`).set(name);
    }

    function addStudent() {
      const nameInput = document.getElementById('stuName');
      const name = nameInput.value.trim();
      if (!name) return alert("O'quvchi ismini kiriting!");

      const newId = Date.now();
      db.ref('students/' + newId).set({ name: name, archived: false });
      nameInput.value = '';
    }

    function archiveStudent(id) {
      if (confirm("Ushbu o'quvchini yotoqxonadan chiqib ketdi deb belgilaysizmi?")) {
        db.ref(`students/${id}/archived`).set(true);
      }
    }

    function restoreStudent(id) {
      db.ref(`students/${id}/archived`).set(false);
    }

    function deleteStudent(id) {
      if (confirm("Ushbu o'quvchini bazadan butunlay o'chirmoqchimisiz?")) {
        db.ref('students/' + id).remove();
      }
    }

    function setStatus(stuId, status) {
      const curDate = dateInput.value;
      db.ref(`attendance/${curDate}/${stuId}`).set(status);
    }

    function renderList() {
      const curDate = dateInput.value;
      
      dutyInput.value = dutyTeachersData[curDate] || '';

      const curAtt = attendanceData[curDate] || {};
      const listDiv = document.getElementById('studentList');
      const archivedDiv = document.getElementById('archivedList');
      
      listDiv.innerHTML = '';
      archivedDiv.innerHTML = '';

      const studentIds = Object.keys(studentsData);
      let activeCount = 0;
      let archivedCount = 0;
      let presentCnt = 0;
      let absentCnt = 0;

      studentIds.forEach(id => {
        const stu = studentsData[id];

        if (stu.archived) {
          archivedCount++;
          const item = document.createElement('div');
          item.className = 'student-item';
          item.innerHTML = `
            <div class="student-info">
              <div class="student-name" style="text-decoration: line-through; color: #888;">${stu.name}</div>
            </div>
            <div class="toggle-btns">
              <button class="btn-restore" onclick="restoreStudent('${id}')">🔄 Qaytarish</button>
              <button class="btn-del" onclick="deleteStudent('${id}')">🗑️ O'chirish</button>
            </div>
          `;
          archivedDiv.appendChild(item);
        } else {
          activeCount++;
          const status = curAtt[id] || 'present';
          if (status === 'present') presentCnt++;
          if (status === 'absent') absentCnt++;

          const item = document.createElement('div');
          item.className = 'student-item';
          item.innerHTML = `
            <div class="student-info">
              <div class="student-name">${stu.name}</div>
            </div>
            <div class="toggle-btns">
              <button class="btn-status btn-present ${status === 'present' ? 'active' : ''}" onclick="setStatus('${id}', 'present')">Bor</button>
              <button class="btn-status btn-absent ${status === 'absent' ? 'active' : ''}" onclick="setStatus('${id}', 'absent')">Yo'q</button>
              <button class="btn-archive" onclick="archiveStudent('${id}')">🚪 Chiqdi</button>
              <button class="btn-del" onclick="deleteStudent('${id}')">🗑️</button>
            </div>
          `;
          listDiv.appendChild(item);
        }
      });

      if (activeCount === 0) {
        listDiv.innerHTML = '<p style="text-align:center; color:#888;">Aktiv o\'quvchilar yo\'q.</p>';
      }
      if (archivedCount === 0) {
        archivedDiv.innerHTML = '<p style="text-align:center; color:#aaa; font-size: 13px;">Chiqib ketganlar yo\'q.</p>';
      }

      document.getElementById('totalCnt').innerText = activeCount;
      document.getElementById('presentCnt').innerText = presentCnt;
      document.getElementById('absentCnt').innerText = absentCnt;
      document.getElementById('archivedCnt').innerText = archivedCount;
    }

    // Excel import
    function importFromExcel(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const worksheet = workbook.Sheets[workbook.SheetNames[0]];
          const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

          let addedCount = 0;
          jsonData.forEach((row, index) => {
            const name = row[0] ? String(row[0]).trim() : (row[1] ? String(row[1]).trim() : '');
            if (name && !name.toLowerCase().includes('f.i.sh') && !name.toLowerCase().includes('ismi')) {
              const newId = Date.now() + index;
              db.ref('students/' + newId).set({ name: name, archived: false });
              addedCount++;
            }
          });

          if (addedCount > 0) {
            alert(`${addedCount} ta o'quvchi bazaga yuklandi!`);
          } else {
            alert("Fayldan ismlar topilmadi. O'quvchilar F.I.Sh. Excel'ning A yoki B ustunidaligini tekshiring.");
          }
        } catch (err) {
          alert("Excel faylni o'qishda xatolik: " + err.message);
        }
        event.target.value = '';
      };
      reader.readAsArrayBuffer(file);
    }

    // Excel export
    function exportToExcel() {
      let excelData = [];
      const dates = Object.keys(attendanceData).sort();
      const activeStudentIds = Object.keys(studentsData).filter(id => !studentsData[id].archived);

      if (activeStudentIds.length === 0) return alert("Eksport qilish uchun o'quvchilar yo'q!");

      if (dates.length === 0) {
        const curDate = dateInput.value;
        const dutyTeacherName = dutyTeachersData[curDate] || "Kiritilmagan";
        activeStudentIds.forEach(id => {
          excelData.push({
            "Sana": curDate,
            "Navbatchi O'qituvchi": dutyTeacherName,
            "O'quvchi F.I.Sh.": studentsData[id].name,
            "Holati": "Bor"
          });
        });
      } else {
        dates.forEach(d => {
          const dutyTeacherName = dutyTeachersData[d] || "Kiritilmagan";
          activeStudentIds.forEach(id => {
            const status = attendanceData[d] && attendanceData[d][id] ? attendanceData[d][id] : 'present';
            excelData.push({
              "Sana": d,
              "Navbatchi O'qituvchi": dutyTeacherName,
              "O'quvchi F.I.Sh.": studentsData[id].name,
              "Holati": status === 'present' ? 'Bor' : "Yo'q"
            });
          });
        });
      }

      const worksheet = XLSX.utils.json_to_sheet(excelData);
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, "Davomat");
      XLSX.writeFile(workbook, `Yotoqxona_Davomati_${dateInput.value}.xlsx`);
    }
  </script>
</body>
</html>
